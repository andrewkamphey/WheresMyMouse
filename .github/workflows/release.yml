name: Build and Release

# Releases go out from a Mac with `./build.sh --release` (Amore publishes them, and Sparkle
# delivers them as updates). This manual workflow is the fallback: a notarized DMG to download
# from the run's artifacts. Run it by hand only; macOS minutes on a private repo aren't free.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26   # Xcode 26 (Swift 6.2), which AmoreKit needs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install the Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build, sign and notarize universal app and DMG
        env:
          ARCH: universal
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./build.sh --notarize

      - name: Zip app
        run: |
          cd dist
          ditto -c -k --keepParent "Where's My Mouse.app" WheresMyMouse.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: WheresMyMouse
          path: |
            dist/WheresMyMouse.zip
            dist/WheresMyMouse.dmg
